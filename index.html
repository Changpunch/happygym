#app{max-width:560px;margin:0 auto;padding:0 16px 120px;min-height:100vh}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid transparent}
.top.sc{border-bottom-color:var(--line)}
.top img.av{width:38px;height:38px;border-radius:50%;background:var(--butter2);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.top .who{flex:1;line-height:1.15}
.top .who b{font-family:Outfit;font-size:17px;letter-spacing:.2px}
.top .who small{display:block;color:var(--muted);font-size:12px}
.top .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.top .ic:active{background:var(--line)}

/* steps */
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--pri)}

h1{font-size:26px;font-weight:900;margin:4px 0 4px;letter-spacing:.3px}
h2{font-size:18px;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px;display:block}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}

/* select */
.sel{position:relative}
.sel select{width:100%;appearance:none;-webkit-appearance:none;background:var(--bg);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 38px 12px 14px;font-size:16px;font-weight:500}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select:focus{outline:none;border-color:var(--pri)}

/* segmented */
.seg{display:inline-flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.seg.sm button{padding:4px 9px;font-size:13px}

/* stepper */
.stp{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;height:46px}
.stp button{width:40px;height:100%;font-size:22px;color:var(--pri);font-weight:500;flex:none}
.stp button:active{background:var(--soft)}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:Outfit;font-size:19px;font-weight:600;padding:0}
.stp input:focus{outline:none}
.stp.sm{height:38px;border-radius:11px}
.stp.sm button{width:32px;font-size:18px}
.stp.sm input{font-size:16px}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:700;font-size:14px}
.chip.y{background:var(--butter);color:#8A6418}
.chip .x{opacity:.6;font-weight:400}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:16px}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(232,51,95,.28)}
.btn.pri:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.add{width:100%;border:1.5px dashed #E2D6C4;border-radius:14px;padding:11px;color:var(--muted);font-weight:500;font-size:15px}
.add:active{background:#fff}
.link{color:var(--pri);font-weight:500;font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,rgba(251,246,238,0))}
.bar .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn{flex:1}

/* module cards */
.mod{padding:0;overflow:hidden}
.mod>.hd{display:flex;align-items:center;gap:12px;padding:14px 16px}
.mod>.hd .em{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.mod>.hd .t{flex:1}
.mod>.hd .t small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.mod.off>.bd{display:none}
.mod.off>.hd{opacity:.55}
.mod>.bd{padding:0 16px 16px}
.sw{width:46px;height:28px;border-radius:999px;background:#E3DBCF;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{left:21px}

.item{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}
.item .ih{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item .ih .sel{flex:1}
.item .del{width:34px;height:34px;border-radius:10px;color:#B9B1A6;font-size:18px;flex:none}
.item .del:active{background:var(--soft);color:var(--pri)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g3 .stp button{width:28px;font-size:18px}
.wbtn{display:flex;align-items:baseline;justify-content:center;gap:4px;height:46px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;font-family:Outfit;font-size:19px;font-weight:600;padding-top:10px}
.wbtn small{font-size:12px;color:var(--muted);font-weight:500}
.wbtn:active{border-color:var(--pri);background:var(--soft)}
.wbtn.sm{height:38px;border-radius:11px;font-size:16px;padding-top:8px}
.set.d .wbtn{opacity:.55}
.wheel{position:relative;height:220px;margin:4px 0 6px}
.wheel::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;background:var(--soft);border-radius:14px}
.wheel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--bg),rgba(251,246,238,0) 38%,rgba(251,246,238,0) 62%,var(--bg))}
.wheel .list{position:relative;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wheel .list::-webkit-scrollbar{display:none}
.wheel .opt{height:44px;scroll-snap-align:center;display:grid;place-items:center;font-family:Outfit;font-size:20px;color:#B5AEA4;transition:font-size .1s}
.wheel .opt.on{color:var(--ink);font-size:28px;font-weight:700}
.wheel .wu{position:absolute;right:22%;top:88px;height:44px;display:grid;place-items:center;font-size:15px;color:var(--pri);font-weight:700;z-index:2;pointer-events:none}
.hero{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.tile b{display:block;font-family:Outfit;font-size:30px;font-weight:800;line-height:1.1}
.tile b small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.tile span{font-size:13px;color:var(--muted)}
.ch-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ch-h small{color:var(--muted);font-size:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;background:#F2EBE0;display:block}
.heat i.l1{background:#FFC9D5}.heat i.l2{background:#FF8CA6}.heat i.l3{background:#E8335F}
.heat i.fut{background:transparent}
.heat i.td{outline:2px solid var(--ink);outline-offset:-2px}
.hwrap{display:grid;grid-template-columns:18px 1fr;gap:6px}
.hdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);align-items:center}
.hleg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:8px}
.hleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.wbars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:130px;padding-top:18px;border-bottom:1px solid var(--line)}
.wbars .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.wbars .c b{font-family:Outfit;font-size:12px;color:var(--ink);margin-bottom:3px}
.wbars .c i{width:100%;max-width:26px;background:var(--pri);border-radius:4px 4px 0 0;display:block;min-height:0}
.wbars .c.now i{background:var(--pri2)}
.wlbl{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-size:10px;color:var(--muted);text-align:center;margin-top:5px}
.pbar{display:grid;grid-template-columns:48px 1fr 34px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.pbar .t{height:12px;background:#F2EBE0;border-radius:4px;overflow:hidden}
.pbar .t i{display:block;height:100%;background:var(--pri);border-radius:0 4px 4px 0}
.pbar span:last-child{font-family:Outfit;color:var(--muted);text-align:right;font-size:13px}
.tip{position:fixed;z-index:70;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;transform:translate(-50%,-110%);white-space:nowrap}
.recent .rr{display:flex;align-items:center;gap:10px;padding:8px 0}
.recent .rr+.rr{border-top:1px dashed var(--line)}
.recent .rd{width:92px;flex:none;line-height:1.2}
.recent .rd b{font-family:Outfit;font-size:16px}
.recent .rd small{display:block;color:var(--muted);font-size:12px}
.g3 .stp input{font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}
.iBtn{width:30px;height:30px;border-radius:50%;background:var(--butter);color:#8A6418;font-family:Outfit;font-weight:800;font-size:15px;flex:none;display:grid;place-items:center}
.iBtn.on{background:#8A6418;color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.info{background:var(--butter2);border:1px solid #F3E2B8;border-radius:14px;padding:12px;margin:0 0 10px;font-size:14px;line-height:1.55}
.info b{font-weight:700}
.info .r{display:flex;gap:8px}
.info .r+.r{margin-top:6px}
.info .k{flex:none;width:20px}
.info .sm{color:#8A6418;font-size:13px}
.sugg{display:flex;gap:10px;align-items:flex-start;background:var(--oksoft);color:#1F6E4A;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:10px}

/* run */
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:8px;transition:width .3s}
.ex{background:#fff;border-radius:16px;border:1.5px solid var(--line);padding:12px 12px 8px;margin-bottom:10px}
.ex.done{border-color:#BFE6D2;background:#FBFFFD}
.ex .eh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex .eh b{font-size:16px;min-width:0}
.ex .eh .sp{flex:1}
.nBtn{height:28px;padding:0 9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12px;color:var(--muted);flex:none;display:inline-flex;align-items:center;gap:3px}
.nBtn.on{background:var(--butter);border-color:#F3E2B8;color:#8A6418;font-weight:700}
.note{font-size:13px;color:#8A6418;background:var(--butter2);border-radius:10px;padding:6px 10px;margin:-2px 0 8px;white-space:pre-wrap;word-break:break-word}
.ex .cnt{font-family:Outfit;font-weight:700;font-size:14px;color:var(--muted)}
.ex.done .cnt{color:var(--ok)}
.set{display:grid;grid-template-columns:40px 1fr 1fr 30px;gap:8px;align-items:center;padding:4px 0}
.set .no{font-family:Outfit;font-size:12px;color:var(--muted);text-align:center}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid #DCD2C4;display:grid;place-items:center;font-size:18px;color:transparent;transition:.15s}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck:active{transform:scale(.92)}
.set.d .stp{opacity:.55}
.set .rm{color:#C9C0B4;font-size:16px;height:30px}
.bub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:2px 0 6px}
.unitTag{font-size:12px;color:var(--muted);margin-left:-4px}
.toolrow{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:4px}

/* summary */
.sum-h{background:linear-gradient(135deg,var(--pri),#FF8A6B);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.sum-h .row img{width:54px;height:54px;border-radius:50%;background:var(--butter2);border:3px solid rgba(255,255,255,.7)}
.sum-h h1{margin:0;color:#fff;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stats div{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:Outfit;font-size:22px;font-weight:800}
.stats small{font-size:11px;opacity:.9}
.sline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sline:last-child{border:0}
.sline span:last-child{color:var(--muted);text-align:right;font-family:Outfit}
.pr{font-size:11px;background:var(--butter);color:#8A6418;padding:2px 6px;border-radius:6px;margin-left:4px;font-weight:700}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px}
.login .logo{width:120px;height:120px;filter:drop-shadow(0 10px 20px rgba(232,51,95,.25))}
.login h1{font-family:Outfit;font-size:34px;margin:14px 0 2px}
.login p{color:var(--muted);margin:0 0 26px}
.login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.login input{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:17px;text-align:center}
.login input:focus{outline:none;border-color:var(--pri)}
.err{color:var(--pri);font-size:14px;min-height:20px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.hello{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .5s ease}
.hello img{width:110px;height:110px;border-radius:50%;background:var(--butter2);border:4px solid #fff;box-shadow:var(--shadow)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

.modal{position:fixed;inset:0;background:rgba(43,42,51,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-radius:12px;margin-bottom:6px}
.mrow span{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>

async function openVault(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(VAULT.iv)},key,b64d(VAULT.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

    try{
      const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(w.s),iterations:VAULT.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      return {u,raw:new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(w.i)},kek,b64d(w.c)))};
    }catch(e){}
  }
  throw new Error("bad password");
}
window.logout=()=>{store.del("gym_key");store.del("gym_user");location.reload()};
function showLogin(msg){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="login"><img class="logo" src="${LOGO}" alt=""><h1 class="brand">Happy Gym</h1><p>今天也要好好練 💪</p>
  <form id="lf"><input id="pw" type="password" placeholder="輸入密碼" autocomplete="current-password" autofocus><div class="err" id="er">${msg||""}</div><button class="btn pri block" id="go" type="submit">進入</button></form></div>`;
  const f=document.getElementById("lf"),er=document.getElementById("er"),go=document.getElementById("go");
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!window.crypto||!crypto.subtle){er.textContent="請用 https 網址開啟（GitHub Pages）";return}
    go.disabled=true;go.textContent="解鎖中…";
    try{
      const r=await unwrap(document.getElementById("pw").value);
      const p=await openVault(r.raw);
      store.set("gym_key",b64e(r.raw));store.set("gym_user",r.u);window.__user=r.u;window.__fresh=true;runApp(p.js);
    }catch(err){
      go.disabled=false;go.textContent="進入";er.textContent="密碼不對喔";
      f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
    }
  });
}
(async()=>{
  if(!VAULT){window.__user=new URLSearchParams(location.search).get("u")||"cph";runApp(document.getElementById("appjs").textContent);return}   // 開發版（未加密）
  const k=store.get("gym_key");
  if(k&&window.crypto&&crypto.subtle){try{const p=await openVault(b64d(k));window.__user=store.get("gym_user")||"cph";runApp(p.js);return}catch(e){store.del("gym_key")}}
  showLogin();
})();
</script>
